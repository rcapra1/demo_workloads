---
- name: Set source cluster API context
  ansible.builtin.include_role:
    name: troshka_workload_cclm_common
    tasks_from: set_cluster_context.yml
  vars:
    cclm_cluster_name: "{{ cclm_source_cluster }}"

- name: Create demo VirtualMachine {{ cclm_seed_vm_name }}
  kubernetes.core.k8s:
    host: "{{ cclm_k8s_host }}"
    api_key: "{{ cclm_k8s_token }}"
    validate_certs: "{{ cclm_k8s_validate_certs }}"
    state: present
    definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: "{{ cclm_seed_vm_name }}"
        namespace: "{{ cclm_vm_namespaces[cclm_source_cluster] }}"
        labels:
          app: cclm-demo
      spec:
        runStrategy: "{{ 'RerunOnFailure' if (cclm_seed_vm_run | bool) else 'Halted' }}"
        dataVolumeTemplates:
          - metadata:
              name: "{{ cclm_seed_vm_name }}"
            spec:
              sourceRef:
                kind: DataSource
                name: "{{ cclm_seed_vm_datasource_name }}"
                namespace: "{{ cclm_seed_vm_datasource_namespace }}"
              storage:
                storageClassName: "{{ cclm_odf_storage_class }}"
                resources:
                  requests:
                    storage: "{{ cclm_seed_vm_disk_size }}"
        template:
          metadata:
            labels:
              kubevirt.io/vm: "{{ cclm_seed_vm_name }}"
          spec:
            domain:
              cpu:
                cores: "{{ cclm_seed_vm_cpu_cores }}"
              memory:
                guest: "{{ cclm_seed_vm_memory }}"
              devices:
                disks:
                  - name: rootdisk
                    disk:
                      bus: virtio
                interfaces:
                  - name: default
                    masquerade: {}
            networks:
              - name: default
                pod: {}
            volumes:
              - name: rootdisk
                dataVolume:
                  name: "{{ cclm_seed_vm_name }}"
